name: Validate Python and PowerShell

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: Sample/Python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: Sample/Python/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run offline unit tests
        run: python -m unittest discover -v
      - name: Compile Python modules
        run: python -m compileall -q .
      - name: Accelerated 48-hour offline shadow soak
        run: python -m automation.soak_offline --hours 48 --interval-minutes 10
      - name: Walk-forward synthetic smoke (must fail readiness gate)
        shell: pwsh
        run: |
          python -m walk_forward_oos --symbol TMFJ6 --synthetic-days 8 --quotes-per-day 36 --fee-per-fill 20 --tax-rate 0.00002 --slippage-ticks 1 --mc-trials 2 --target-ticks 4,6 --half-width-ticks 2,4 --output output/research/ci-synthetic-walkforward
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $result = Get-Content output/research/ci-synthetic-walkforward.json -Raw | ConvertFrom-Json
          if ($result.production_research_gate_pass -or $result.verified_real_source -or -not (Test-Path output/research/ci-synthetic-walkforward.md)) {
            throw "Synthetic data must never pass research readiness"
          }
      - name: Validate CLI
        run: python sim_hft_bot.py --help
      - name: Parse automation PowerShell scripts
        shell: pwsh
        run: |
          $scripts = Get-ChildItem -Path automation, '../../azure' -Filter '*.ps1' -File
          foreach ($script in $scripts) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $script.FullName, [ref]$tokens, [ref]$errors
            )
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "$($script.Name): $_" }
              throw "PowerShell parse failure: $($script.Name)"
            }
          }
      - name: Release validation (offline)
        shell: pwsh
        run: |
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File automation/validate_release.ps1 -WorkDir (Get-Location).Path -SkipUnitTests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
