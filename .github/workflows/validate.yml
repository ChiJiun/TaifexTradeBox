name: Validate Python and PowerShell

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: Sample/Python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: Sample/Python/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run offline unit tests
        run: python -m unittest discover -v
      - name: Compile Python modules
        run: python -m compileall -q .
      - name: Validate CLI
        run: python sim_hft_bot.py --help
      - name: Parse automation PowerShell scripts
        shell: pwsh
        run: |
          $scripts = Get-ChildItem -Path automation, '../../azure' -Filter '*.ps1' -File
          foreach ($script in $scripts) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $script.FullName, [ref]$tokens, [ref]$errors
            )
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "$($script.Name): $_" }
              throw "PowerShell parse failure: $($script.Name)"
            }
          }
      - name: Release validation (offline)
        shell: pwsh
        run: |
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File automation/validate_release.ps1 -WorkDir (Get-Location).Path -SkipUnitTests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
